<!DOCTYPE html>
<html>

<head>

	<title>Geometry Dash</title>

	<link rel="icon" href="favicon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="style.css">

<body>

	<h1>Geometry Dash</h1>

	<h2>Click on the window below to start!</h2>

	<svg id="game" viewBox="0 0 600 420" width="800">

		<!-- background -->
		<rect id="bg" x="0" y="0" width="600" height="420" />

		<!-- level container -->
		<g id="level" />

		<!-- ground container -->
		<g id="ground-container" />

		<!-- level completion text (hidden by default) -->
		<text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" stroke="#000000"
			stroke-width="2" font-size="45" style="display: none;">Level completed!</text>

		<defs>

			<!-- gradient for blocks -->
			<linearGradient id="gradient" x1="0%" y1="0%" x2="0%" y2="100%">
				<stop offset="0%" stop-color="#000000" />
				<stop offset="100%" stop-color="#00000000" />
			</linearGradient>

			<!-- player cube -->
			<g id="cube">
				<rect x="0" y="0" width="30" height="30" fill="#ffff00" stroke="#000000" stroke-width="1.5" />
				<rect x="7" y="6" width="5" height="5" fill="#00ffff" stroke="#000000" stroke-width="1.5" />
				<rect x="18" y="6" width="5" height="5" fill="#00ffff" stroke="#000000" stroke-width="1.5" />
				<rect x="5" y="15" width="20" height="5" fill="#00ffff" stroke="#000000" stroke-width="1.5" />
			</g>

			<!-- player ship -->
			<g id="ship">
				<rect x="7.5" y="3" width="15" height="15" fill="#ffff00" stroke="#000000" stroke-width="0.75" />
				<rect x="11" y="6" width="2.5" height="2.5" fill="#00ffff" stroke="#000000" stroke-width="0.75" />
				<rect x="16.5" y="6" width="2.5" height="2.5" fill="#00ffff" stroke="#000000" stroke-width="0.75" />
				<rect x="10" y="10.5" width="10" height="2.5" fill="#00ffff" stroke="#000000" stroke-width="0.75" />

				<polygon points="3,16 10,18 20,18 30,20 30,24 20,26 10,26 3,28 3,25 0,25 0,19 3,19" fill="#ffff00"
					stroke="#000000" stroke-width="1.5" />
				<line x1="3" y1="19" x2="3" y2="25" stroke="#000000" stroke-width="1.5" />
				<line x1="10" y1="18" x2="10" y2="26" stroke="#000000" stroke-width="1.5" />
				<line x1="20" y1="18" x2="20" y2="26" stroke="#000000" stroke-width="1.5" />
				<polygon points="5.5,12 5.5,20 25,20 25,17 8.5,16 8.5,12" fill="#00ffff" stroke="#000000"
					stroke-width="1.5" />
			</g>

			<!-- spike -->
			<g id="spike">
				<polygon points="0,30 15,0 30,30" fill="url(#gradient)" stroke="#ffffff" stroke-width="1.5" />

				<!-- hitbox (invisible) -->
				<g id="death-hitbox" display="none">
					<rect x="12.5" y="9.5" width="5" height="11" fill="#ff000080" />
				</g>
			</g>

			<!-- default block -->
			<g id="default-block">
				<rect x="0" y="0" width="30" height="30" fill="url(#gradient)" stroke="#ffffff" stroke-width="1.5" />

				<!-- solid hitbox (invisible) -->
				<g id="block-hitbox" display="none">
					<rect x="0" y="0" width="30" height="14" fill="#0000ff80" />
				</g>

				<!-- death hitbox (invisible) -->
				<g id="death-hitbox" display="none">
					<rect x="0" y="14" width="30" height="2" fill="#ff000080" />
				</g>

				<!-- ceiling hitbox (invisible) -->
				<g id="ceiling-hitbox" display="none">
					<rect x="0" y="16" width="30" height="14" fill="#ff00ff80" />
				</g>
			</g>

			<!-- grid block (1 side) -->
			<g id="grid-block-1-side">
				<rect x="0" y="0" width="9" height="9" fill="#000000" />
				<rect x="10.5" y="0" width="9" height="9" fill="#000000" />
				<rect x="21" y="0" width="9" height="9" fill="#000000" />
				<rect x="0" y="10.5" width="9" height="9" fill="#000000bf" />
				<rect x="10.5" y="10.5" width="9" height="9" fill="#000000bf" />
				<rect x="21" y="10.5" width="9" height="9" fill="#000000bf" />
				<rect x="0" y="21" width="9" height="9" fill="#00000080" />
				<rect x="10.5" y="21" width="9" height="9" fill="#00000080" />
				<rect x="21" y="21" width="9" height="9" fill="#00000080" />

				<line x1="0" y1="0" x2="30" y2="0" stroke="#ffffff" stroke-width="1.5" />

				<!-- solid hitbox (invisible) -->
				<g id="block-hitbox" display="none">
					<rect x="0" y="0" width="30" height="14" fill="#0000ff80" />
				</g>

				<!-- death hitbox (invisible) -->
				<g id="death-hitbox" display="none">
					<rect x="0" y="14" width="30" height="2" fill="#ff000080" />
				</g>

				<!-- ceiling hitbox (invisible) -->
				<g id="ceiling-hitbox" display="none">
					<rect x="0" y="16" width="30" height="14" fill="#ff00ff80" />
				</g>
			</g>

			<!-- grid block (outside corner) -->
			<g id="grid-block-outside-corner">
				<rect x="0" y="0" width="9" height="9" fill="#000000" />
				<rect x="10.5" y="0" width="9" height="9" fill="#000000" />
				<rect x="21" y="0" width="9" height="9" fill="#000000" />
				<rect x="0" y="10.5" width="9" height="9" fill="#000000" />
				<rect x="10.5" y="10.5" width="9" height="9" fill="#000000bf" />
				<rect x="21" y="10.5" width="9" height="9" fill="#000000bf" />
				<rect x="0" y="21" width="9" height="9" fill="#000000" />
				<rect x="10.5" y="21" width="9" height="9" fill="#000000bf" />
				<rect x="21" y="21" width="9" height="9" fill="#00000080" />

				<polyline points="0,30 0,0 30,0" fill="#00000000" stroke="#ffffff" stroke-width="1.5" />

				<!-- solid hitbox (invisible) -->
				<g id="block-hitbox" display="none">
					<rect x="0" y="0" width="30" height="14" fill="#0000ff80" />
				</g>

				<!-- death hitbox (invisible) -->
				<g id="death-hitbox" display="none">
					<rect x="0" y="14" width="30" height="2" fill="#ff000080" />
				</g>

				<!-- ceiling hitbox (invisible) -->
				<g id="ceiling-hitbox" display="none">
					<rect x="0" y="16" width="30" height="14" fill="#ff00ff80" />
				</g>
			</g>

			<!-- grid block (inside corner) -->
			<g id="grid-block-inside-corner">
				<rect x="0" y="0" width="9" height="9" fill="#000000" />
				<rect x="10.5" y="0" width="9" height="9" fill="#000000bf" />
				<rect x="21" y="0" width="9" height="9" fill="#00000080" />
				<rect x="0" y="10.5" width="9" height="9" fill="#000000bf" />
				<rect x="10.5" y="10.5" width="9" height="9" fill="#000000bf" />
				<rect x="21" y="10.5" width="9" height="9" fill="#00000080" />
				<rect x="0" y="21" width="9" height="9" fill="#00000080" />
				<rect x="10.5" y="21" width="9" height="9" fill="#00000080" />
				<rect x="21" y="21" width="9" height="9" fill="#00000080" />

				<rect x="-0.75" y="-0.75" width="1.5" height="1.5" fill="#ffffff" />

				<!-- solid hitbox (invisible) -->
				<g id="block-hitbox" display="none">
					<rect x="0" y="0" width="30" height="14" fill="#0000ff80" />
				</g>

				<!-- death hitbox (invisible) -->
				<g id="death-hitbox" display="none">
					<rect x="0" y="14" width="30" height="2" fill="#ff000080" />
				</g>

				<!-- ceiling hitbox (invisible) -->
				<g id="ceiling-hitbox" display="none">
					<rect x="0" y="16" width="30" height="14" fill="#ff00ff80" />
				</g>
			</g>

			<!-- empty grid block (no hitbox) -->
			<g id="grid-block-empty">
				<rect x="0" y="0" width="9" height="9" fill="#00000080" />
				<rect x="10.5" y="0" width="9" height="9" fill="#00000080" />
				<rect x="21" y="0" width="9" height="9" fill="#00000080" />
				<rect x="0" y="10.5" width="9" height="9" fill="#00000080" />
				<rect x="10.5" y="10.5" width="9" height="9" fill="#00000040" />
				<rect x="21" y="10.5" width="9" height="9" fill="#00000080" />
				<rect x="0" y="21" width="9" height="9" fill="#00000080" />
				<rect x="10.5" y="21" width="9" height="9" fill="#00000080" />
				<rect x="21" y="21" width="9" height="9" fill="#00000080" />
			</g>

			<!-- grid block (3 sides) -->
			<g id="grid-block-3-sides">
				<rect x="0" y="0" width="9" height="9" fill="#000000" />
				<rect x="10.5" y="0" width="9" height="9" fill="#000000" />
				<rect x="21" y="0" width="9" height="9" fill="#000000" />
				<rect x="0" y="10.5" width="9" height="9" fill="#000000" />
				<rect x="10.5" y="10.5" width="9" height="9" fill="#000000bf" />
				<rect x="21" y="10.5" width="9" height="9" fill="#000000" />
				<rect x="0" y="21" width="9" height="9" fill="#000000" />
				<rect x="10.5" y="21" width="9" height="9" fill="#000000bf" />
				<rect x="21" y="21" width="9" height="9" fill="#000000" />

				<polyline points="0,30 0,0 30,0 30,30" fill="#00000000" stroke="#ffffff" stroke-width="1.5" />

				<!-- solid hitbox (invisible) -->
				<g id="block-hitbox" display="none">
					<rect x="0" y="0" width="30" height="14" fill="#0000ff80" />
				</g>

				<!-- death hitbox (invisible) -->
				<g id="death-hitbox" display="none">
					<rect x="0" y="14" width="30" height="2" fill="#ff000080" />
				</g>

				<!-- ceiling hitbox (invisible) -->
				<g id="ceiling-hitbox" display="none">
					<rect x="0" y="16" width="30" height="14" fill="#ff00ff80" />
				</g>
			</g>

			<!-- grid block (parallel sides) -->
			<g id="grid-block-parallel">
				<rect x="0" y="0" width="9" height="9" fill="#000000" />
				<rect x="10.5" y="0" width="9" height="9" fill="#000000bf" />
				<rect x="21" y="0" width="9" height="9" fill="#000000" />
				<rect x="0" y="10.5" width="9" height="9" fill="#000000" />
				<rect x="10.5" y="10.5" width="9" height="9" fill="#000000bf" />
				<rect x="21" y="10.5" width="9" height="9" fill="#000000" />
				<rect x="0" y="21" width="9" height="9" fill="#000000" />
				<rect x="10.5" y="21" width="9" height="9" fill="#000000bf" />
				<rect x="21" y="21" width="9" height="9" fill="#000000" />

				<line x1="0" y1="0" x2="0" y2="30" stroke="#ffffff" stroke-width="1.5" />
				<line x1="30" y1="0" x2="30" y2="30" stroke="#ffffff" stroke-width="1.5" />

				<!-- solid hitbox (invisible) -->
				<g id="block-hitbox" display="none">
					<rect x="0" y="0" width="30" height="14" fill="#0000ff80" />
				</g>

				<!-- death hitbox (invisible) -->
				<g id="death-hitbox" display="none">
					<rect x="0" y="14" width="30" height="2" fill="#ff000080" />
				</g>

				<!-- ceiling hitbox (invisible) -->
				<g id="ceiling-hitbox" display="none">
					<rect x="0" y="16" width="30" height="14" fill="#ff00ff80" />
				</g>
			</g>

			<!-- ground spikes -->
			<g id="ground-spikes">
				<polygon points="0,20 5,0 10,20 15,0 20,20 25,0 30,20" fill="#000000" />

				<!-- hitbox (invisible) -->
				<g id="death-hitbox" display="none">
					<rect x="12.5" y="9.5" width="5" height="11" fill="#ff000080" />
				</g>
			</g>

			<!-- jump pad -->
			<g id="jump-pad">
				<path d="M 0 30 Q 15 20 30 30 Z" fill="#ffff00" stroke="#ffffff" stroke-width="1.5" />

				<!-- hitbox (invisible) -->
				<g id="pad-hitbox" display="none">
					<rect x="0" y="22.5" width="30" height="7.5" fill="#00ff0080" />
				</g>
			</g>

			<!-- jump orb -->
			<g id="jump-orb">
				<circle cx="15" cy="15" r="15" fill="#00000000" stroke="#ffffff" stroke-width="1.5" />
				<circle cx="15" cy="15" r="11.25" fill="#ffff00" stroke="#ffffff" stroke-width="1.5" />

				<!-- hitbox (invisible) -->
				<g id="orb-hitbox" display="none">
					<rect x="0" y="0" width="30" height="30" fill="#00ff0080" />
				</g>
			</g>

			<!-- small spike -->
			<g id="small-spike">
				<polygon points="0,30 15,20 30,30" fill="url(#gradient)" stroke="#ffffff" stroke-width="1.5" />

				<!-- hitbox (invisible) -->
				<g id="death-hitbox" display="none">
					<rect x="12.5" y="20.5" width="5" height="5" fill="#ff000080" />
				</g>
			</g>

			<!-- default block slab -->
			<g id="slab">
				<rect x="0" y="0" width="30" height="15" fill="url(#gradient)" stroke="#ffffff" stroke-width="1.5" />

				<!-- solid hitbox (invisible) -->
				<g id="block-hitbox" display="none">
					<rect x="0" y="0" width="30" height="6.5" fill="#0000ff80" />
				</g>

				<!-- death hitbox (invisible) -->
				<g id="death-hitbox" display="none">
					<rect x="0" y="6.5" width="30" height="2" fill="#ff000080" />
				</g>

				<!-- ceiling hitbox (invisible) -->
				<g id="ceiling-hitbox" display="none">
					<rect x="0" y="8.5" width="30" height="6.5" fill="#ff00ff80" />
				</g>
			</g>

			<!-- ship portal -->
			<g id="ship-portal">
				<ellipse cx="17.5" cy="45" rx="10" ry="30" fill="#000000" />
				<rect x="12.5" y="15" width="5" height="60" />
				<ellipse cx="12.5" cy="45" rx="10" ry="30" fill="#ff00ff" stroke="#ffffff" stroke-width="1.5" />
				<ellipse cx="12.5" cy="45" rx="5" ry="20" fill="#000000" />

				<!-- hitbox (invisible) -->
				<g id="ship-portal-hitbox" display="none">
					<rect x="0" y="0" width="30" height="90" fill="#00ff0080" />
				</g>
			</g>

			<!-- cube portal -->
			<g id="cube-portal">
				<ellipse cx="17.5" cy="45" rx="10" ry="30" fill="#000000" />
				<rect x="12.5" y="15" width="5" height="60" />
				<ellipse cx="12.5" cy="45" rx="10" ry="30" fill="#00ff00" stroke="#ffffff" stroke-width="1.5" />
				<ellipse cx="12.5" cy="45" rx="5" ry="20" fill="#000000" />

				<!-- hitbox (invisible) -->
				<g id="cube-portal-hitbox" display="none">
					<rect x="0" y="0" width="30" height="90" fill="#00ff0080" />
				</g>
			</g>

			<!-- upside-down portal -->
			<g id="upside-down-portal">
				<ellipse cx="17.5" cy="45" rx="10" ry="30" fill="#000000" />
				<rect x="12.5" y="15" width="5" height="60" />
				<ellipse cx="12.5" cy="45" rx="10" ry="30" fill="#ffff00" stroke="#ffffff" stroke-width="1.5" />
				<ellipse cx="12.5" cy="45" rx="5" ry="20" fill="#000000" />

				<!-- hitbox (invisible) -->
				<g id="upside-down-portal-hitbox" display="none">
					<rect x="0" y="0" width="30" height="90" fill="#00ff0080" />
				</g>
			</g>

			<!-- normal gravity portal -->
			<g id="normal-gravity-portal">
				<ellipse cx="17.5" cy="45" rx="10" ry="30" fill="#000000" />
				<rect x="12.5" y="15" width="5" height="60" />
				<ellipse cx="12.5" cy="45" rx="10" ry="30" fill="#00ffff" stroke="#ffffff" stroke-width="1.5" />
				<ellipse cx="12.5" cy="45" rx="5" ry="20" fill="#000000" />

				<!-- hitbox (invisible) -->
				<g id="normal-gravity-portal-hitbox" display="none">
					<rect x="0" y="0" width="30" height="90" fill="#00ff0080" />
				</g>
			</g>

			<!-- background colour trigger (invisible) -->
			<g id="bg-trigger">
				<!-- hitbox (invisible) -->
				<g id="bg-trigger-hitbox" display="none">
					<rect x="15" y="-435" width="1" height="900" fill="#00ff0080" />
				</g>
			</g>

			<!-- ground colour trigger (invisible) -->
			<g id="ground-trigger">
				<!-- hitbox (invisible) -->
				<g id="ground-trigger-hitbox" display="none">
					<rect x="15" y="-435" width="1" height="900" fill="#00ff0080" />
				</g>
			</g>

			<!-- ground -->
			<g id="ground">
				<rect id="ground-rect" x="0" y="0" width="120" height="120" fill="currentColor" />
				<rect x="10" y="10" width="100" height="100" fill="#00000020" />
				<line x1="0" y1="0" x2="120" y2="0" stroke="#ffffff" stroke-width="1.5" />
			</g>

			<!-- ceiling -->
			<g id="ceiling">
				<rect id="ceiling-rect" x="0" y="0" width="120" height="120" fill="currentColor" />
				<rect x="10" y="10" width="100" height="100" fill="#00000020" />
				<line x1="0" y1="120" x2="120" y2="120" stroke="#ffffff" stroke-width="1.5" />
			</g>

			<!-- death effect -->
			<g id="death-effect">
				<circle cx="15" cy="15" r="0" fill="#00ffffbf">
					<animate attributeName="r" from="0" to="90" dur="333ms" begin="indefinite" />
					<animate attributeName="fill" from="#00ffffbf" to="#00ffff00" dur="333ms" begin="indefinite" />
				</circle>
			</g>

		</defs>

	</svg>

	<p>level select:</p>

	<form autocomplete="off">
		<input type="radio" name="level" value="1" checked>
		<label for="level1">1: Stereo Madness (easy) </label>
		<br />

		<input type="radio" name="level" value="2">
		<label for="level2">2: Back On Track (normal) </label>
		<br />

		<input type="radio" name="level" value="3">
		<label for="level3">3: Polargeist (hard) </label>
		<br />

		<input type="radio" name="level" value="4">
		<label for="level4">4: Dry Out (harder) </label>
	</form>


	<script src="levels/1.js"></script>
	<script src="levels/2.js"></script>
	<script src="levels/3.js"></script>
	<script src="levels/4.js"></script>
	<script src="script.js"></script>

</body>

</html>
